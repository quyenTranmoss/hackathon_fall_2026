# Render Blueprint — defines both services in one file.
# Deploy: push this to your repo root, then in Render Dashboard ->
# New -> Blueprint -> connect your repo. Render reads this automatically.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ---------- BACKEND (Node API) ----------
  - type: web
    name: myapp-backend          # <- rename as you like; it sets the onrender.com subdomain
    runtime: node
    plan: free                    # free tier: no persistent disk, spins down after 15 min idle
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        value: https://myapp-frontend.onrender.com   # <- update after first deploy, see README

    # NOTE: no persistent disk on the free plan. server/data/swollen-teams.db
    # will reset to whatever seed.js/reset.js produce on every redeploy and
    # every time the free instance is rebuilt. If you outgrow this, add a
    # `disk:` block here and switch plan to "starter" ($7/mo + $0.25/GB/mo).

  # ---------- FRONTEND (Vite static site) ----------
  - type: web
    name: myapp-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite               # needed so client-side routing (React Router etc.) works
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://myapp-backend.onrender.com   # <- update after first deploy, see README
